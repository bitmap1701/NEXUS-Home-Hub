# ADR-56 (TASK-14b): GitHub Actions CI for NEXUS Home Hub.
# Zero-BOM gate over every tracked file, strict build (-warnaserror) on the .NET 8 SDK, and a headless MCP smoke test
# (JSON-RPC stdio, mock Gemini, no window). It is the compile check for branches pushed from environments without .NET.
name: NEXUS CI

on:
  push:
    branches: [ main, 'claude/**', 'docs/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build (-warnaserror), Zero-BOM, MCP smoke
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The runner image also has newer SDKs; pin the job to the SDK installed above (CI only, not committed).
      - name: Pin .NET 8 SDK for this job
        shell: pwsh
        run: |
          $sdk = "${{ steps.dotnet.outputs.dotnet-version }}"
          [ordered]@{ sdk = [ordered]@{ version = $sdk; rollForward = 'latestPatch' } } | ConvertTo-Json | Set-Content -Path global.json -Encoding ascii
          dotnet --version

      - name: Zero-BOM gate (git ls-files; *.ps1 must keep its BOM)
        shell: pwsh
        run: ./01_Foundation_Engine/tools/Test-NexusBom.ps1

      # TASK-12: the Verify scripts are written where no PowerShell runs; parse them here (no execution, a few seconds).
      - name: PowerShell syntax check (tools/*.ps1, Windows PowerShell 5.1 parser)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem 01_Foundation_Engine/tools -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host ("{0}:{1}: {2}" -f $f.Name, $e.Extent.StartLineNumber, $e.Message); $bad++ }
          }
          if ($bad -gt 0) { throw "$bad PowerShell parse error(s)" }
          Write-Host 'All tools/*.ps1 parse cleanly.'

      # The solution file is .slnx (needs SDK 9.0.200+), so the two entry projects are built directly;
      # HostService pulls in Core and CockpitUI, McpTools pulls in Core.
      - name: Build HostService (Release, -warnaserror)
        shell: pwsh
        run: dotnet build 01_Foundation_Engine/NEXUSHome.HostService/NEXUSHome.HostService.csproj -c Release -warnaserror -v minimal

      - name: Build McpTools (Release, -warnaserror)
        shell: pwsh
        run: dotnet build 01_Foundation_Engine/NEXUSHome.McpTools/NEXUSHome.McpTools.csproj -c Release -warnaserror -v minimal

      - name: Headless MCP smoke (JSON-RPC stdio, mock Gemini)
        shell: pwsh
        run: ./01_Foundation_Engine/tools/Invoke-CiSmoke.ps1

      # TASK-12c: the Gate 12 headless selftests (mock Gemini, synthetic images in %TEMP%, no network) on every push:
      # vision (compression, zero-copy, 4096 px limit, McpTools --vision-worker, cache SLA), vision-guard (shields),
      # vision-mem (settled growth and plateau with visionWorker = process). About 35 s on the runner.
      # TASK-16: ui-v2 (snap math, cockpit_ui.json, K450 EQ switch in a temp folder, simulated G272 YouTube, loopback webhook).
      # TASK-16c: ui-v2-visual (palette catalogue + filters, @agent dispatch, Hủy of a 3 s mock request, window self-check never shown).
      # TASK-17: net-ptt (loopback listener + TEST-NET pings, FIFINE selector, VAD on synthetic PCM, clipboard worker vs a hung owner).
      - name: Headless Gate 12 / 16 / 16b / 15 / 16c / 17 selftests (vision, vision-guard, vision-mem, ui-v2, ui-v2b, ctx-safeguard, ui-v2-visual, net-ptt)
        shell: pwsh
        env:
          NEXUS_ROOT: ${{ github.workspace }}
        run: |
          $exe = '01_Foundation_Engine/NEXUSHome.HostService/bin/Release/net8.0-windows/NEXUSHome.HostService.exe'
          $failed = @()
          foreach ($s in 'vision', 'vision-guard', 'vision-mem', 'ui-v2', 'ui-v2b', 'ctx-safeguard', 'ui-v2-visual', 'ui-footprint', 'net-ptt') {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process $exe -ArgumentList '--selftest', $s -PassThru -Wait
            $prefix = switch ($s) { 'ui-v2' { 'task16' } 'ui-v2b' { 'task16b' } 'ctx-safeguard' { 'task15' } 'ui-v2-visual' { 'task16c' } 'ui-footprint' { 'task16c' } 'net-ptt' { 'task17' } default { 'task12' } }
            $path = "03_Local_Data_Vault/handoff/${prefix}_selftest_$s.json"
            Write-Host "===== $s exit $($p.ExitCode) in $([math]::Round($sw.Elapsed.TotalSeconds, 1)) s ====="
            if (Test-Path $path) { Get-Content $path -Raw | Write-Host } else { Write-Host "no report $path" }
            if ($p.ExitCode -ne 0) { $failed += $s }
          }
          if ($failed.Count -gt 0) { throw "Selftest(s) failed: $($failed -join ', ')" }
